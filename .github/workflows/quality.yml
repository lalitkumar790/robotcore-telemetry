name: quality
on:
  push:
  pull_request:
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source snapshots
        run: python -m compileall -q hardware
      - name: Validate telemetry schema JSON
        run: python -m json.tool schemas/telemetry-record.schema.json > /dev/null
      - name: Validate experiment manifest JSON
        run: python -m json.tool data/manifests/experiment.example.json > /dev/null
