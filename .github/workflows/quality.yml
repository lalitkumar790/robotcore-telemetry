name: quality
on:
  push:
  pull_request:
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hardware test dependencies
        run: |
          python -m pip install -r hardware/pi-transmitter/requirements.txt
          python -m pip install -r hardware/laptop-receiver/requirements.txt
      - name: Compile Python source snapshots
        run: python -m compileall -q hardware
      - name: Validate telemetry schema JSON
        run: python -m json.tool schemas/telemetry-record.schema.json > /dev/null
      - name: Validate experiment manifest JSON
        run: python -m json.tool data/manifests/experiment.example.json > /dev/null
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("apps/web-dashboard/import.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert scripts, "No inline script found in CSV inspector"
          Path("/tmp/robotcore-import.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/robotcore-import.js
      - name: Validate live dashboard JavaScript syntax
        run: node --check apps/web-dashboard/dashboard.js
      - name: Run Pi protocol tests
        run: python -m unittest discover -s hardware/pi-transmitter/tests -p "test_*.py"
      - name: Run laptop receiver protocol tests
        run: python -m unittest discover -s hardware/laptop-receiver/tests -p "test_*.py"
